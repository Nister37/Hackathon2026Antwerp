services:
  db:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hackathon2026
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d hackathon2026"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/hackathon2026
      DB_USER: app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      TRANSACTIONS_DIR: /app/data
      INSIGHTS_FILE: /app/profiles/profile_suggestions.json
    volumes:
      - ./data:/app/data:ro
      - ./profiles:/app/profiles:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1024m

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    mem_limit: 128m

volumes:
  postgres-data:
