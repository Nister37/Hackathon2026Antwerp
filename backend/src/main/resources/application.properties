spring.application.name=hackathon2026-antwerp-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9432/hackathon2026}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:Student_1234}

server.port=${SERVER_PORT:8080}
app.transactions.directory=${TRANSACTIONS_DIR:../data}
app.insights.file=${INSIGHTS_FILE:../ml/profile_suggestions.json}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
